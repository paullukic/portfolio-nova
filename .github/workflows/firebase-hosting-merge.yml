# Production deploy of paullukic.com (hosting target "main" -> site "paullukic-com").
# Manual only: deploys are triggered by Hermes after Paul confirms. Do not add a push trigger
# until the domain cutover checklist in README.md is done.
name: Deploy paullukic.com (manual)
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build:release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CYBERPUNK_PORTFOLIO_PAXHAX }}
          channelId: live
          projectId: cyberpunk-portfolio-paxhax
          target: main
