# Production deploy of paullukic.com (hosting target "main" -> site "paullukic-com").
# Runs on every push to master (this repo's default branch); can also be run by hand.
# build:release fails on TODO(paul) markers, PII and dead links, so a bad build never ships.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  workflow_dispatch:
concurrency:
  group: hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      # the prerender step renders / in a real browser
      - run: npx playwright install --with-deps chromium
      - run: npm run build:release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CYBERPUNK_PORTFOLIO_PAXHAX }}
          channelId: live
          projectId: cyberpunk-portfolio-paxhax
          target: main
